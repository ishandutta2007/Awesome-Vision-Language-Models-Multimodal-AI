<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1.5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-card-1 {
        animation: float1 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: float2 6s ease-in-out infinite 1s;
      }
      .floating-card-3 {
        animation: float1 8s ease-in-out infinite 2s;
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .flow-beam {
        stroke-dasharray: 16 12;
        animation: beamFlow 14s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic ambient glowing orbs behind everything -->
  <circle cx="200" cy="110" r="180" fill="url(#glowGrad1)" filter="url(#blurFilter)" class="pulsing-orb" />
  <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#blurFilter)" class="pulsing-orb" style="animation-duration: 9s;" />
  <circle cx="680" cy="70" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" opacity="0.4" />

  <!-- Subtle dynamic neural connection lines (background decorative flows) -->
  <g opacity="0.35">
    <path d="M 50 210 Q 300 80 600 210 T 1150 210" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" class="flow-beam" />
    <path d="M 100 290 Q 400 390 750 270 T 1180 140" fill="none" stroke="#818cf8" stroke-width="1.2" class="flow-beam" style="animation-direction: reverse; animation-duration: 20s;" />
  </g>

  <!-- Decorative floating tech cards (Positioned to sides so center title stays 100% unobscured) -->
  <!-- Left Side Floating Pill: Vision Encoders -->
  <g class="floating-card-1" transform="translate(60, 75)">
    <rect width="180" height="52" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="28" cy="26" r="12" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="28" y="30" text-anchor="middle" font-size="13">👁️</text>
    <text x="50" y="24" fill="#f8fafc" class="badge-text">Vision Encoding</text>
    <text x="50" y="38" fill="#94a3b8" font-size="9.5" font-family="sans-serif">CLIP • SigLIP • DINOv2</text>
  </g>

  <!-- Left Side Floating Card: Grounding & Pointing -->
  <g class="floating-card-2" transform="translate(45, 275)">
    <rect width="200" height="56" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="30" cy="28" r="12" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
    <text x="30" y="32" text-anchor="middle" font-size="13">🎯</text>
    <text x="52" y="25" fill="#f8fafc" class="badge-text">Visual Grounding</text>
    <text x="52" y="40" fill="#94a3b8" font-size="9.5" font-family="sans-serif">2D Bounding &amp; Pointing</text>
  </g>

  <!-- Right Side Floating Card: High-Throughput Serving Engines -->
  <g class="floating-card-3" transform="translate(950, 75)">
    <rect width="195" height="54" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="28" cy="27" r="12" fill="#9333ea" fill-opacity="0.3" stroke="#c084fc" stroke-width="1" />
    <text x="28" y="31" text-anchor="middle" font-size="13">⚡</text>
    <text x="50" y="24" fill="#f8fafc" class="badge-text">Inference Serving</text>
    <text x="50" y="39" fill="#94a3b8" font-size="9.5" font-family="sans-serif">vLLM • SGLang • llama.cpp</text>
  </g>

  <!-- Right Side Floating Pill: Document & OCR Extraction -->
  <g class="floating-card-1" transform="translate(960, 275)">
    <rect width="185" height="56" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="28" cy="28" r="12" fill="#db2777" fill-opacity="0.3" stroke="#f472b6" stroke-width="1" />
    <text x="28" y="32" text-anchor="middle" font-size="13">📄</text>
    <text x="48" y="25" fill="#f8fafc" class="badge-text">Multimodal OCR</text>
    <text x="48" y="40" fill="#94a3b8" font-size="9.5" font-family="sans-serif">Docling • GOT-OCR • MinerU</text>
  </g>

  <!-- Central Foreground Content - 100% Unobscured & Crystal Clear -->
  <g transform="translate(600, 150)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, -60)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.2" />
      <circle cx="-145" cy="0" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="4" y="4" text-anchor="middle" fill="#38bdf8" font-size="11.5" class="badge-text">CURATED MULTIMODAL AI &amp; VLM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="44" class="title-text" filter="url(#softGlow)">
      Vision-Language Models
    </text>
    <text x="0" y="68" text-anchor="middle" fill="url(#accentGrad)" font-size="34" class="title-text">
      &amp; Multimodal AI
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="112" text-anchor="middle" fill="#94a3b8" font-size="15.5" class="subtitle-text">
      Open-Weight Foundation VLMs • Visual Grounding • OCR • Labeling SaaS • High-Throughput Serving
    </text>

    <!-- Metric / Feature Highlights Line -->
    <g transform="translate(0, 152)">
      <text x="-210" y="0" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="sans-serif">🌟 35+ Open-Source Projects</text>
      <circle cx="-105" cy="-4" r="2" fill="#64748b" />
      <text x="0" y="0" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="sans-serif">📊 Real-Time Star Badges</text>
      <circle cx="105" cy="-4" r="2" fill="#64748b" />
      <text x="210" y="0" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="sans-serif">🏢 Enterprise SaaS Benchmarks</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" />
</svg>
